<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收钱吧收银台</title>
<!--
  ⚠️ 收钱吧没有沙盒环境，此页面将发起真实交易

  零依赖单文件收银台实现，适用于简易 POS 终端场景。
  直接在浏览器中打开即可使用（需后端 API 服务运行）。
-->
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: #f5f5f5;
}

.cashier-app {
  max-width: 800px;
  margin: 0 auto;
  background: #fff;
  min-height: 100vh;
}

/* Header */
.cashier-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px;
  background: #1a73e8;
  color: white;
}
.cashier-header h1 { font-size: 20px; }
.operator { font-size: 14px; opacity: 0.9; }

/* Amount display */
.amount-display {
  text-align: center;
  padding: 24px;
  font-size: 48px;
  font-weight: bold;
}
.currency {
  font-size: 24px;
  vertical-align: top;
}

/* Numpad */
.numpad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 16px;
}
.num-btn {
  padding: 16px;
  font-size: 20px;
  border: 1px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  background: white;
}
.num-btn:active { background: #e8e8e8; }
.clear-btn { background: #f5f5f5; }

/* Scan section */
.scan-section { padding: 16px; }

.barcode-input {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  border: 2px solid #1a73e8;
  border-radius: 8px;
  margin-bottom: 16px;
  box-sizing: border-box;
}

.pay-btn {
  width: 100%;
  padding: 16px;
  font-size: 20px;
  background: #1a73e8;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
.pay-btn:disabled { background: #ccc; cursor: not-allowed; }

/* Status display */
.status-display {
  text-align: center;
  padding: 48px 16px;
}

.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #ddd;
  border-top-color: #1a73e8;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.icon-success { font-size: 64px; color: #34a853; }
.icon-failed  { font-size: 64px; color: #ea4335; }

.result-amount { font-size: 32px; font-weight: bold; }
.hint { color: #666; font-size: 14px; }
.elapsed { color: #999; font-size: 13px; }

.action-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 24px;
}
.action-btn {
  padding: 12px 24px;
  border: 1px solid #ddd;
  border-radius: 8px;
  cursor: pointer;
  background: white;
  font-size: 16px;
}
.action-btn.primary {
  background: #1a73e8;
  color: white;
  border: none;
}

/* Order info */
.order-info {
  padding: 16px;
  border-top: 1px solid #eee;
  margin-top: 16px;
}
.order-info h3 { margin-bottom: 8px; }
.order-info p { margin: 4px 0; font-size: 14px; color: #333; }

.refund-btn {
  margin-top: 8px;
  padding: 8px 16px;
  background: #ea4335;
  color: white;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: 14px;
}

.hidden { display: none; }
</style>
</head>
<body>

<div class="cashier-app">
  <!-- Header -->
  <header class="cashier-header">
    <h1>收钱吧收银台</h1>
    <span class="operator">操作员: <span id="operatorName">cashier_01</span></span>
  </header>

  <main>
    <!-- 金额输入区 -->
    <section>
      <div class="amount-display">
        <span class="currency">¥</span>
        <span id="amountDisplay">0.00</span>
      </div>
      <div class="numpad">
        <button class="num-btn" onclick="inputAmount('1')">1</button>
        <button class="num-btn" onclick="inputAmount('2')">2</button>
        <button class="num-btn" onclick="inputAmount('3')">3</button>
        <button class="num-btn" onclick="inputAmount('4')">4</button>
        <button class="num-btn" onclick="inputAmount('5')">5</button>
        <button class="num-btn" onclick="inputAmount('6')">6</button>
        <button class="num-btn" onclick="inputAmount('7')">7</button>
        <button class="num-btn" onclick="inputAmount('8')">8</button>
        <button class="num-btn" onclick="inputAmount('9')">9</button>
        <button class="num-btn clear-btn" onclick="clearAmount()">C</button>
        <button class="num-btn" onclick="inputAmount('0')">0</button>
        <button class="num-btn" onclick="inputAmount('.')">.</button>
      </div>
    </section>

    <!-- 扫码支付区 -->
    <section class="scan-section">
      <!-- 待扫码（idle 状态） -->
      <div id="idlePanel">
        <input
          id="barcodeInput"
          type="text"
          class="barcode-input"
          placeholder="扫描付款码或手动输入"
          autofocus
        />
        <button id="payBtn" class="pay-btn" disabled onclick="submitPayment()">
          收款 ¥<span id="payBtnAmount">0.00</span>
        </button>
      </div>

      <!-- 支付状态展示 -->
      <div id="statusPanel" class="status-display hidden">
        <!-- 支付中 -->
        <div id="statusProcessing" class="hidden">
          <div class="spinner"></div>
          <p>支付处理中...</p>
          <p id="passwordHint" class="hint hidden">请顾客在手机上输入密码</p>
          <p class="elapsed">已等待 <span id="elapsedSeconds">0</span> 秒</p>
        </div>

        <!-- 支付成功 -->
        <div id="statusSuccess" class="hidden">
          <div class="icon-success">✓</div>
          <p class="result-amount">¥<span id="successAmount">0.00</span></p>
          <p>支付成功</p>
          <div class="action-buttons">
            <button class="action-btn" onclick="printReceipt()">打印小票</button>
            <button class="action-btn primary" onclick="reset()">下一笔</button>
          </div>
        </div>

        <!-- 支付失败 -->
        <div id="statusFailed" class="hidden">
          <div class="icon-failed">✗</div>
          <p id="errorMessage"></p>
          <div class="action-buttons">
            <button class="action-btn primary" onclick="reset()">重新收款</button>
          </div>
        </div>

        <!-- 超时 -->
        <div id="statusTimeout" class="hidden">
          <p>交易超时</p>
          <div class="action-buttons">
            <button class="action-btn" onclick="continuePolling()">继续等待</button>
            <button class="action-btn primary" onclick="reset()">取消交易</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 订单信息 -->
    <section id="orderInfo" class="order-info hidden">
      <h3>最近交易</h3>
      <p>订单号: <span id="orderClientSn"></span></p>
      <p>金额: ¥<span id="orderAmount"></span></p>
      <p>状态: <span id="orderStatus"></span></p>
      <button id="refundBtn" class="refund-btn hidden" onclick="refundOrder()">退款</button>
    </section>
  </main>
</div>

<script>
// ⚠️ 收钱吧没有沙盒环境，此页面将发起真实交易

(function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // 配置
  // ---------------------------------------------------------------------------
  var API_BASE = '/api';
  var OPERATOR = 'cashier_01';

  // ---------------------------------------------------------------------------
  // 状态
  // ---------------------------------------------------------------------------
  var amountStr = '';
  var barcode = '';
  var status = 'idle'; // idle | processing | success | failed | timeout
  var elapsedSeconds = 0;
  var lastOrder = null;
  var pollingTimer = null;
  var elapsedTimer = null;
  var submitting = false;

  // ---------------------------------------------------------------------------
  // DOM 引用
  // ---------------------------------------------------------------------------
  var $amountDisplay = document.getElementById('amountDisplay');
  var $payBtnAmount = document.getElementById('payBtnAmount');
  var $payBtn = document.getElementById('payBtn');
  var $barcodeInput = document.getElementById('barcodeInput');
  var $idlePanel = document.getElementById('idlePanel');
  var $statusPanel = document.getElementById('statusPanel');
  var $statusProcessing = document.getElementById('statusProcessing');
  var $statusSuccess = document.getElementById('statusSuccess');
  var $statusFailed = document.getElementById('statusFailed');
  var $statusTimeout = document.getElementById('statusTimeout');
  var $elapsedSeconds = document.getElementById('elapsedSeconds');
  var $errorMessage = document.getElementById('errorMessage');
  var $successAmount = document.getElementById('successAmount');
  var $orderInfo = document.getElementById('orderInfo');
  var $orderClientSn = document.getElementById('orderClientSn');
  var $orderAmount = document.getElementById('orderAmount');
  var $orderStatus = document.getElementById('orderStatus');
  var $refundBtn = document.getElementById('refundBtn');

  // ---------------------------------------------------------------------------
  // 工具函数
  // ---------------------------------------------------------------------------

  /** 元转分，避免浮点精度问题 */
  function yuanToFen(yuan) {
    return Math.round(parseFloat(yuan || '0') * 100).toString();
  }

  /** 分转元 */
  function fenToYuan(fen) {
    return (parseInt(fen, 10) / 100).toFixed(2);
  }

  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }

  // ---------------------------------------------------------------------------
  // UI 更新
  // ---------------------------------------------------------------------------

  function updateAmountDisplay() {
    var display = amountStr || '0.00';
    $amountDisplay.textContent = display;
    $payBtnAmount.textContent = display;
    $successAmount.textContent = display;
    updatePayBtnState();
  }

  function updatePayBtnState() {
    var amount = parseFloat(amountStr);
    $payBtn.disabled = !(amount > 0 && barcode.length > 10);
  }

  function setStatusView(newStatus) {
    status = newStatus;

    // 切换面板可见性
    if (status === 'idle') {
      show($idlePanel);
      hide($statusPanel);
    } else {
      hide($idlePanel);
      show($statusPanel);
    }

    // 隐藏所有状态子面板
    hide($statusProcessing);
    hide($statusSuccess);
    hide($statusFailed);
    hide($statusTimeout);

    // 显示对应状态
    switch (status) {
      case 'processing': show($statusProcessing); break;
      case 'success':    show($statusSuccess); break;
      case 'failed':     show($statusFailed); break;
      case 'timeout':    show($statusTimeout); break;
    }
  }

  function updateOrderInfo() {
    if (!lastOrder) {
      hide($orderInfo);
      return;
    }
    show($orderInfo);
    $orderClientSn.textContent = lastOrder.client_sn || '';
    $orderAmount.textContent = fenToYuan(lastOrder.total_amount);
    $orderStatus.textContent = lastOrder.order_status || '';

    if (lastOrder.order_status === 'PAID') {
      show($refundBtn);
    } else {
      hide($refundBtn);
    }
  }

  // ---------------------------------------------------------------------------
  // 金额输入（挂载到 window 供 onclick 调用）
  // ---------------------------------------------------------------------------

  window.inputAmount = function (key) {
    if (key === '.' && amountStr.includes('.')) return;
    if (amountStr.includes('.') && amountStr.split('.')[1].length >= 2) return;
    amountStr += key;
    updateAmountDisplay();
  };

  window.clearAmount = function () {
    amountStr = '';
    updateAmountDisplay();
  };

  // ---------------------------------------------------------------------------
  // 计时器
  // ---------------------------------------------------------------------------

  function startElapsedTimer() {
    stopElapsedTimer();
    elapsedSeconds = 0;
    $elapsedSeconds.textContent = '0';
    elapsedTimer = setInterval(function () {
      elapsedSeconds++;
      $elapsedSeconds.textContent = String(elapsedSeconds);
    }, 1000);
  }

  function stopElapsedTimer() {
    if (elapsedTimer !== null) {
      clearInterval(elapsedTimer);
      elapsedTimer = null;
    }
  }

  function stopPolling() {
    if (pollingTimer !== null) {
      clearTimeout(pollingTimer);
      pollingTimer = null;
    }
  }

  // ---------------------------------------------------------------------------
  // 支付结果回调
  // ---------------------------------------------------------------------------

  function onPaySuccess(data) {
    setStatusView('success');
    lastOrder = data;
    updateOrderInfo();
    stopPolling();
    stopElapsedTimer();
    submitting = false;
  }

  function onPayFailed(message) {
    setStatusView('failed');
    $errorMessage.textContent = message;
    stopPolling();
    stopElapsedTimer();
    submitting = false;
  }

  // ---------------------------------------------------------------------------
  // 轮询支付结果
  // ---------------------------------------------------------------------------

  function startPolling(clientSn) {
    var startTime = Date.now();

    function poll() {
      fetch(API_BASE + '/query?client_sn=' + encodeURIComponent(clientSn))
        .then(function (res) { return res.json(); })
        .then(function (result) {
          var orderStatus = result.data && result.data.order_status;

          if (orderStatus === 'PAID') {
            onPaySuccess(result.data);
            return;
          }
          if (orderStatus === 'PAY_CANCELED') {
            onPayFailed('支付已取消');
            return;
          }

          var elapsed = (Date.now() - startTime) / 1000;

          // 60 秒超时提示
          if (elapsed > 60 && status !== 'timeout') {
            setStatusView('timeout');
            stopElapsedTimer();
            return;
          }

          // 继续轮询：前 60 秒每 3 秒，之后每 10 秒
          var interval = elapsed < 60 ? 3000 : 10000;
          pollingTimer = setTimeout(poll, interval);
        })
        .catch(function () {
          // 查询失败，继续重试
          pollingTimer = setTimeout(poll, 3000);
        });
    }

    pollingTimer = setTimeout(poll, 3000);
  }

  // ---------------------------------------------------------------------------
  // 提交支付
  // ---------------------------------------------------------------------------

  window.submitPayment = function () {
    var amount = parseFloat(amountStr);
    if (!(amount > 0 && barcode.length > 10)) return;
    if (submitting) return; // 防重复提交
    submitting = true;

    setStatusView('processing');
    startElapsedTimer();

    fetch(API_BASE + '/pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        total_amount: yuanToFen(amountStr),
        dynamic_id: barcode.trim(),
        subject: '门店消费',
        operator: OPERATOR,
      }),
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        if (result.status === 'SUCCESS') {
          onPaySuccess(result.data);
        } else if (result.status === 'PENDING') {
          startPolling(result.data.client_sn);
        } else {
          onPayFailed(result.message || '支付失败');
        }
      })
      .catch(function (error) {
        onPayFailed('网络错误: ' + error.message);
      });
  };

  // ---------------------------------------------------------------------------
  // 继续等待（从超时状态恢复）
  // ---------------------------------------------------------------------------

  window.continuePolling = function () {
    setStatusView('processing');
    startElapsedTimer();
    // 继续轮询（使用上次的 client_sn）
  };

  // ---------------------------------------------------------------------------
  // 重置
  // ---------------------------------------------------------------------------

  window.reset = function () {
    amountStr = '';
    barcode = '';
    elapsedSeconds = 0;
    submitting = false;
    stopPolling();
    stopElapsedTimer();
    setStatusView('idle');
    updateAmountDisplay();
    $barcodeInput.value = '';
    setTimeout(function () { $barcodeInput.focus(); }, 0);
  };

  // ---------------------------------------------------------------------------
  // 打印小票
  // ---------------------------------------------------------------------------

  window.printReceipt = function () {
    // TODO: 调用打印服务
    window.print();
  };

  // ---------------------------------------------------------------------------
  // 退款
  // ---------------------------------------------------------------------------

  window.refundOrder = function () {
    if (!lastOrder) return;
    if (!confirm('确认退款？')) return;

    fetch(API_BASE + '/refund', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        sn: lastOrder.sn,
        refund_amount: lastOrder.total_amount,
        operator: OPERATOR,
      }),
    })
      .then(function (res) { return res.json(); })
      .then(function (result) {
        alert(result.message || '退款已提交');
      })
      .catch(function (error) {
        alert('退款请求失败: ' + error.message);
      });
  };

  // ---------------------------------------------------------------------------
  // 事件绑定
  // ---------------------------------------------------------------------------

  // 条码输入框：回车提交 + 实时同步状态
  $barcodeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      window.submitPayment();
    }
  });

  $barcodeInput.addEventListener('input', function () {
    barcode = $barcodeInput.value;
    updatePayBtnState();
  });

  // 保持扫码输入框聚焦（点击页面其他区域后自动回焦）
  document.addEventListener('click', function (e) {
    if (status === 'idle' && e.target !== $barcodeInput && !e.target.closest('.numpad')) {
      setTimeout(function () { $barcodeInput.focus(); }, 100);
    }
  });

  // ---------------------------------------------------------------------------
  // 初始化
  // ---------------------------------------------------------------------------
  updateAmountDisplay();
  $barcodeInput.focus();

})();
</script>
</body>
</html>
